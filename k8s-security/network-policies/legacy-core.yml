# Seul le service payment peut joindre le core COBOL (Zero Trust / PCI Req 1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-to-legacy-core
  namespace: securepay
spec:
  podSelector:
    matchLabels:
      app: payment
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: legacy-core
      ports:
        - protocol: TCP
          port: 8004
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-payment-only
  namespace: securepay
spec:
  podSelector:
    matchLabels:
      app: legacy-core
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: payment
      ports:
        - protocol: TCP
          port: 8004
