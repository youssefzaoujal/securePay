# Vault Agent Injector annotations example (PCI secrets never in ConfigMap).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securepay-tokenization
  namespace: securepay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenization-vault-sidecar
  namespace: securepay
  labels:
    app: tokenization
    app.kubernetes.io/name: tokenization
    app.kubernetes.io/part-of: securepay
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tokenization
  template:
    metadata:
      labels:
        app: tokenization
      annotations:
        securepay.io/trivy-scanned: "pass"
        securepay.io/trivy-severity-gate: "CRITICAL,HIGH"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "securepay-tokenization"
        vault.hashicorp.com/agent-inject-secret-vault-key: "secret/data/securepay/encryption"
        vault.hashicorp.com/agent-inject-template-vault-key: |
          {{- with secret "secret/data/securepay/encryption" -}}
          export VAULT_MASTER_KEY="{{ .Data.data.vault_master_key }}"
          {{- end }}
    spec:
      serviceAccountName: securepay-tokenization
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: tokenization
          image: ghcr.io/securepay/tokenization:1.0.0
          ports:
            - containerPort: 8002
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
