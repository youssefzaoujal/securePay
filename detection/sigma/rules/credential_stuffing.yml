# Sigma Rule: Credential Stuffing Detection
# MITRE ATT&CK: T1110 - Brute Force
# Description: Detects credential stuffing against Keycloak/SecurePay authentication

title: SecurePay - Credential Stuffing Attack Detected
id: 2f4a5b6c-7d8e-9f0a-1b2c-3d4e5f6a7b8c
status: experimental
description: |
  Detects credential-stuffing attacks against the SecurePay authentication endpoint.
  Pattern: Many authentication failures from the same IP/user in rapid succession.
  MITRE ATT&CK: T1110.004 (Credential Stuffing)
references:
  - https://attack.mitre.org/techniques/T1110/004/
author: SecurePay SOC
date: 2026/08/26
tags:
  - attack.credential_stuffing
  - attack.t1110
  - authentication.security
  - severity.high

logsource:
  product: keycloak
  service: authentication
  category: auth_event

detection:
  selection_event:
    event_type:
      - login_error
      - authentication_attempt

  selection_error:
    status: failed

  condition: selection_event and selection_error

  timeframe: 60s
  count: 5

fields:
  - source_ip
  - username
  - realm
  - error
  - timestamp

falsepositives:
  - User forgetting password
  - Password rotation period

level: high

output:
  title: "Possible Credential Stuffing Attack"
  description: "Multiple authentication failures from same source detected"
  mitre_attack:
    - tactic: TA0006
      technique: T1110.004
      name: Credential Stuffing
  recommended_actions:
    - Temporarily block source IP
    - Enable rate limiting on auth endpoint
    - Alert security team
    - Review affected accounts for compromise
