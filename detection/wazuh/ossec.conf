# Wazuh Configuration for SecurePay Detection
# File: ossec.conf

<ossec_config>
  <global>
    <email_notification>yes</email_notification>
    <email_to>security@securepay.dev</email_to>
    <smtp_server>smtp.securepay.dev</smtp_server>
    <email_from>wazuh@securepay.dev</email_from>
    <email_maxperhour>12</email_maxperhour>
  </global>

  <alerts>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
  </alerts>

  <!-- SecurePay log monitoring -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/securepay/events*.jsonl</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nginx/securepay_access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/keycloak/securepay.log</location>
  </localfile>

  <!-- Active response: block IPs -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100100,100200</rules_id>
    <timeout>1800</timeout>
  </active-response>

  <!-- Integration: Slack alerts -->
  <integration>
    <name>slack</name>
    <hook_url>https://hooks.slack.com/services/YOUR/WEBHOOK/URL</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
    <rule_id>100100,100200,100300,100400</rule_id>
  </integration>
</ossec_config>
