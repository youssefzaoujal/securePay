# NGINX lab — HTTP. Upstreams dynamiques (gateway peut être absent hors profil app).
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;

log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_method":"$request_method",'
    '"request_uri":"$request_uri","status":$status,"request_time":$request_time,'
    '"correlation_id":"$http_x_correlation_id"}';

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/access.log json_combined;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx"}';
        add_header Content-Type application/json;
    }

    location /soc/ {
        set $detection_upstream http://detection:8010;
        proxy_pass $detection_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /api/v1/payments {
        limit_req zone=payment_limit burst=5 nodelay;
        set $gateway_upstream http://gateway:8000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $gateway_upstream http://gateway:8000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /atm/ {
        proxy_connect_timeout 8s;
        proxy_read_timeout 8s;
        set $atm_upstream http://atm-adapter:8016;
        proxy_pass $atm_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location / {
        set $cc_upstream http://commandcenter:9000;
        proxy_pass $cc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(php|asp|aspx|jsp)$ { return 403; }
    location ~* \.env$ { return 403; }
}
