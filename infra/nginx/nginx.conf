# =============================================================================
# NGINX Reverse Proxy with WAF (ModSecurity + OWASP CRS)
# Phase 3: Sécurisation et passerelle API
# =============================================================================

upstream gateway_backend {
    server gateway:8000;
}

upstream payment_backend {
    server payment:8001;
}

upstream tokenization_backend {
    server tokenization:8002;
}

upstream fraud_backend {
    server fraud:8003;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Logging format JSON structuré (PCI-DSS Req 10)
log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"http_authorization":"$http_authorization",'
        '"correlation_id":"$http_x_correlation_id"'
    '}';

server {
    listen 443 ssl http2;
    server_name api.securepay.dev;

    # TLS (PCI-DSS Req 4)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide server version
    server_tokens off;

    # Logging
    access_log /var/log/nginx/securepay_access.log json_combined;
    error_log  /var/log/nginx/securepay_error.log warn;

    # Connection limits
    limit_conn conn_limit 20;

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    # API Gateway (principal)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        # Timeout
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # Payment endpoints (rate limit strict)
    location /api/v1/payments {
        limit_req zone=payment_limit burst=5 nodelay;

        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # Tokenization (interne uniquement)
    location /api/v1/tokens {
        limit_req zone=payment_limit burst=5 nodelay;

        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block common attack patterns
    location ~* \.(php|asp|aspx|jsp)$ {
        return 403;
    }

    location ~* \.env$ {
        return 403;
    }

    # Block common scanners
    location ~* (wp-admin|wp-login|phpmyadmin|admin\.php) {
        return 403;
    }

    # Default deny
    location / {
        return 404 '{"error":"Not Found"}';
        add_header Content-Type application/json;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.securepay.dev;
    return 301 https://$server_name$request_uri;
}
