apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-payment
  labels:
    app: payment
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: securepay
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.payment.replicaCount }}
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: securepay
      annotations:
        securepay.io/trivy-scanned: "pass"
        securepay.io/trivy-severity-gate: "CRITICAL,HIGH"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: payment
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.payment.image.repository }}:{{ .Values.payment.image.tag }}"
          ports:
            - containerPort: 8001
          resources:
            {{- toYaml .Values.payment.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.global.environment | quote }}
            - name: SECUREPAY_EVENT_LOG
              value: /app/logs/securepay-events.jsonl
            - name: LEGACY_CORE_URL
              value: https://{{ .Release.Name }}-legacy-core:8004
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-payment
  labels: { app: payment, app.kubernetes.io/part-of: securepay }
spec:
  type: ClusterIP
  selector: { app: payment }
  ports:
    - port: 8001
      targetPort: 8001