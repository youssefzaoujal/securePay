apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-directory-server
  labels:
    app: directory-server
    app.kubernetes.io/name: directory-server
    app.kubernetes.io/part-of: securepay
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directory-server
  template:
    metadata:
      labels:
        app: directory-server
        app.kubernetes.io/name: directory-server
        app.kubernetes.io/part-of: securepay
      annotations:
        securepay.io/trivy-scanned: "pass"
        securepay.io/trivy-severity-gate: "CRITICAL,HIGH"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: directory-server
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.directoryServer.image.repository }}:{{ .Values.directoryServer.image.tag }}"
          ports:
            - containerPort: 8021
          resources:
            {{- toYaml .Values.directoryServer.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.global.environment | quote }}
            - name: THREEDS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-three-ds-secret
                  key: secret
                  optional: true
            - name: ACS_URL
              value: http://{{ .Release.Name }}-acs-simulator:8022
          livenessProbe:
            httpGet: { path: /health, port: 8021 }
          readinessProbe:
            httpGet: { path: /health, port: 8021 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-directory-server
  labels: { app: directory-server, app.kubernetes.io/part-of: securepay }
spec:
  type: ClusterIP
  selector: { app: directory-server }
  ports:
    - port: 8021
      targetPort: 8021