{{- if .Values.security.networkPolicy }}
# Défaut-deny par namespace (PCI-DSS Req 1 default-deny) puis autorisations
# minimales service→service. Seuls les flux ci-dessous sont ouverts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    app.kubernetes.io/part-of: securepay
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-ingress
  labels:
    app.kubernetes.io/part-of: securepay
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["ingress-nginx", {{ .Release.Namespace | quote }}]
      ports: [{ port: 8000 }]
---
# gateway → payment / fraud / tokenization / three-ds-server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-egress
  labels:
    app.kubernetes.io/part-of: securepay
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: payment } }
        - podSelector: { matchLabels: { app: fraud } }
        - podSelector: { matchLabels: { app: tokenization } }
        - podSelector: { matchLabels: { app: three-ds-server } }
{{- end }}