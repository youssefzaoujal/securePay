apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-acs-simulator
  labels:
    app: acs-simulator
    app.kubernetes.io/name: acs-simulator
    app.kubernetes.io/part-of: securepay
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acs-simulator
  template:
    metadata:
      labels:
        app: acs-simulator
        app.kubernetes.io/name: acs-simulator
        app.kubernetes.io/part-of: securepay
      annotations:
        securepay.io/trivy-scanned: "pass"
        securepay.io/trivy-severity-gate: "CRITICAL,HIGH"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: acs-simulator
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.acsSimulator.image.repository }}:{{ .Values.acsSimulator.image.tag }}"
          ports:
            - containerPort: 8022
          resources:
            {{- toYaml .Values.acsSimulator.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.global.environment | quote }}
            - name: THREEDS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-three-ds-secret
                  key: secret
                  optional: true
          livenessProbe:
            httpGet: { path: /health, port: 8022 }
          readinessProbe:
            httpGet: { path: /health, port: 8022 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-acs-simulator
  labels: { app: acs-simulator, app.kubernetes.io/part-of: securepay }
spec:
  type: ClusterIP
  selector: { app: acs-simulator }
  ports:
    - port: 8022
      targetPort: 8022