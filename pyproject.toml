[project]
name = "securepay"
version = "1.0.0"
description = "Passerelle de paiement simulée — PCI-inspirée, SOC Sigma/MITRE, Kubernetes durci"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SecurePay Team"}
]
keywords = ["payment", "pci-dss", "oauth2", "tokenization", "fraud-detection", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "httpx>=0.25.0,<1.0.0",
    "redis>=8.1.0,<9.0.0",
    "structlog>=23.2.0,<24.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "gateway*", "payment*", "tokenization*", "fraud*", "detection*", "cspm*", "legacy_core*", "atm*", "three_ds*", "directory_server*", "acs_simulator*", "legacy_3ds1*", "kafka*", "grpc_svc*", "vault_*", "network_token*", "hsm*", "openbanking*", "iso20022*", "compliance*", "istio*"]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.25.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "httpx>=0.25.0,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.7.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "safety>=2.3.0,<3.0.0",
    "aiosqlite>=0.19.0",
    "grpcio>=1.58.0,<2.0.0",
    "grpcio-tools>=1.58.0,<2.0.0",
    "aiokafka>=0.10.0,<1.0.0",
    "hvac>=2.1.0,<3.0.0",
    "python-pkcs11>=0.7.0,<2.0.0",
    "opentelemetry-api>=1.24.0,<2.0.0",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0,<2.0.0",
]
all = ["securepay[ml,dev]"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "SIM", "TCH"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB)",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
